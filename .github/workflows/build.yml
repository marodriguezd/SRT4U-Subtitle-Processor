name: Build & Release Multiplatform

on:
  push:
    branches:
      - main
    # Actions cannot glob by format, so this stays wide; the release job's
    # tools/release_check.py gate rejects anything but vMAJOR.MINOR.PATCH.
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party Actions are pinned to immutable commit SHAs (tag kept as a
# trailing comment); Dependabot bumps them weekly and a test guards the pinning.

env:
  # All three builds use the same pinned tag from eugeneware/ffmpeg-static so
  # artifacts stay reproducible; never the yt-dlp `latest` tag (purged after
  # ~14 days, the URL 404s). `b6.1.1` is the publisher's release id, not an
  # FFmpeg banner. When publishing, bump pyproject.toml and application/version.py.
  FFMPEG_VERSION: "b6.1.1"
  # appimagetool also tracked the moving `continuous` tag, which left
  # the AppImage unreproducible. Same stable tag for every build.
  APPIMAGETOOL_VERSION: "1.9.1"

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # `.[api]` is mandatory: three test modules import fastapi at module
          # level, so without it collection fails and no build or release runs.
          pip install -r requirements.txt ".[api]"
          pip install pytest pytest-cov ruff==0.16.9

      - name: "Lint with ruff (ruff.toml: F,E7,E9,B)"
        run: ruff check application main.py conftest.py tests tools

      - name: Check formatting with ruff format
        run: ruff format --check application main.py conftest.py tests tools

      - name: Run screenshot tool smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_screenshot_tool.py -v

      - name: Run full deterministic test suite
        env:
          QT_QPA_PLATFORM: offscreen
        # `-m "not network"` keeps the suite deterministic (network tests are
        # opt-in); coverage is enforced by the pyproject floor, never padded.
        run: python -m pytest tests/ -q -m "not network" --cov=application --cov-report=term-missing --cov-fail-under=62

  # The minimum bound and the Qt runtime both resolve from requirements.txt,
  # so only that file changes when the bound is raised.
  compat-min-pyqt6:
    name: Compatibility (minimum PyQt6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg

      - name: Resolve the PyQt6 lower bound from requirements.txt
        id: min
        run: |
          MIN=$(grep -oP 'PyQt6>=\K[0-9]+\.[0-9]+\.[0-9]+' requirements.txt)
          if [ -z "$MIN" ]; then
            echo "PyQt6 minimum bound not found in requirements.txt"
            exit 1
          fi
          MINOR="${MIN%.*}"
          MAJOR="${MINOR%%.*}"
          NEXT_MINOR="${MAJOR}.$(( ${MINOR##*.} + 1 ))"
          echo "version=$MIN" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "next_minor=$NEXT_MINOR" >> "$GITHUB_OUTPUT"
          echo "Declared minimum PyQt6 $MIN (Qt runtime $MINOR.x)"
          sed "s/^PyQt6.*/PyQt6==${MIN}/" requirements.txt > /tmp/requirements-min.txt
          cat /tmp/requirements-min.txt

      - name: Install the declared minimum stack
        run: |
          python -m pip install --upgrade pip
          # `.[api]` for the same reason as the test job; PyQt6 stays pinned to
          # ==MIN through requirements-min.txt, which the next step verifies.
          pip install -r /tmp/requirements-min.txt "PyQt6-Qt6>=${{ steps.min.outputs.minor }},<${{ steps.min.outputs.next_minor }}" pytest ".[api]"

      - name: Verify that the pinned minimum is really installed
        env:
          MIN_PYQT6: ${{ steps.min.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import sys

          from PyQt6.QtCore import PYQT_VERSION_STR, QT_VERSION_STR

          expected = os.environ["MIN_PYQT6"]
          print(f"PyQt6 {PYQT_VERSION_STR} / Qt {QT_VERSION_STR} (declared minimum {expected})")
          if PYQT_VERSION_STR != expected:
              sys.exit(f"ERROR: expected PyQt6 {expected} but installed {PYQT_VERSION_STR}")
          PY

      - name: Run the test suite against the minimum PyQt6
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q -m "not network"

  # Guards for the declared `>=3.10` floor: `tomllib` is 3.11+ stdlib, so 3.10
  # installs `tomli` from [dev] and tests/_toml_compat.py selects it.
  compat-min-python:
    name: Compatibility (minimum Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies (base + api + dev)
        run: |
          python -m pip install --upgrade pip
          python --version
          pip install -r requirements.txt ".[api]" ".[dev]"

      - name: Run the pyproject-reading guards on Python 3.10
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_coherence.py tests/test_analytics_packaging.py tests/test_hardening_portfolio.py -q -m "not network"

  build-windows:
    name: Build Windows (.exe)
    needs: [test, compat-min-pyqt6, compat-min-python]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Static FFmpeg (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/eugeneware/ffmpeg-static/releases/download/${{ env.FFMPEG_VERSION }}/ffmpeg-win32-x64" -OutFile "ffmpeg.exe"
          .\ffmpeg.exe -version

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "SRT4U" `
            --add-data "application;application" `
            --add-data "assets;assets" `
            --add-data "LICENSE;." `
            --add-binary "ffmpeg.exe;." `
            --icon "assets/icon.ico" `
            main.py

      - name: Rename binary
        run: |
          Move-Item -Path "dist/SRT4U.exe" -Destination "dist/SRT4U-Windows-x64.exe"

      - name: Smoke-test executable (launch, resources, bundled FFmpeg)
        # Runs the binary in hidden --smoke-test mode; --noconsole has no stderr,
        # so diagnostics come from the temp log, printed in both outcomes.
        timeout-minutes: 5
        shell: pwsh
        run: |
          & "dist/SRT4U-Windows-x64.exe" --smoke-test
          $code = $LASTEXITCODE
          Get-Content -Path (Join-Path $env:TEMP "srt4u-smoke.log") -ErrorAction SilentlyContinue
          exit $code

      - name: Stamp release version (provenance marker)
        # PyInstaller compresses the Python code, so the version literal is not
        # greppable; this stamp next to the binary is what a release verifies.
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Set-Content -Path dist/RELEASE_VERSION -Value $v -NoNewline
          Write-Output "RELEASE_VERSION=$v"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SRT4U-Windows-x64
          path: |
            dist/SRT4U-Windows-x64.exe
            dist/RELEASE_VERSION

  build-linux:
    name: Build Linux (.AppImage)
    needs: [test, compat-min-pyqt6, compat-min-python]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xz-utils \
            file

      - name: Download Static FFmpeg (Linux)
        run: |
          curl -sL "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_VERSION}/ffmpeg-linux-x64" -o ffmpeg
          chmod +x ./ffmpeg
          ./ffmpeg -version

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "SRT4U" \
            --add-data "application:application" \
            --add-data "assets:assets" \
            --add-data "LICENSE:." \
            --add-binary "ffmpeg:." \
            --icon "assets/icon.ico" \
            main.py

      - name: Package AppImage
        run: |
          # Prepare the AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/SRT4U AppDir/usr/bin/SRT4U
          cp ./ffmpeg AppDir/usr/bin/ffmpeg
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/srt4u.png
          cp assets/icon.png AppDir/srt4u.png

          # Desktop file
          cat << 'EOF' > AppDir/srt4u.desktop
          [Desktop Entry]
          Name=SRT4U
          GenericName=Subtitle Processor
          Comment=Subtitle Processor, Translator & Formatter
          Exec=SRT4U
          Icon=srt4u
          Type=Application
          Categories=AudioVideo;AudioVideoEditing;Utility;
          Terminal=false
          StartupWMClass=SRT4U
          Keywords=subtitle;srt;translate;video;audio;
          EOF

          # AppRun
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export QT_XCB_GL_INTEGRATION="${QT_XCB_GL_INTEGRATION:-none}"
          exec "${HERE}/usr/bin/SRT4U" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download appimagetool and package the AppImage
          curl -sL "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          ./appimagetool --version
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/SRT4U-Linux-x86_64.AppImage

          # Fallback tarball
          cd dist
          tar -czvf SRT4U-Linux-x86_64.tar.gz SRT4U
          cd ..

      - name: Smoke-test AppImage (launch, resources, bundled FFmpeg)
        # APPIMAGE_EXTRACT_AND_RUN avoids FUSE on the runner; offscreen Qt needs
        # no display, and the smoke path covers startup only.
        timeout-minutes: 5
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          LOG="${TMPDIR:-/tmp}/srt4u-smoke.log"
          rm -f "$LOG"
          status=0
          dist/SRT4U-Linux-x86_64.AppImage --smoke-test || status=$?
          cat "$LOG" 2>/dev/null || true
          exit $status

      - name: Stamp release version (provenance marker)
        # See the Windows equivalent: the stamp sits next to the binary because
        # PyInstaller compresses the code; sed keeps it portable across greps.
        run: |
          sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml > dist/RELEASE_VERSION
          cat dist/RELEASE_VERSION

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SRT4U-Linux-x86_64
          path: |
            dist/SRT4U-Linux-x86_64.AppImage
            dist/SRT4U-Linux-x86_64.tar.gz
            dist/RELEASE_VERSION

  build-macos:
    name: Build macOS (.dmg)
    needs: [test, compat-min-pyqt6, compat-min-python]
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Download Static FFmpeg (macOS)
        run: |
          curl -sL "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_VERSION}/ffmpeg-darwin-arm64.gz" | gzip -d > ffmpeg-arm64
          curl -sL "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_VERSION}/ffmpeg-darwin-x64.gz" | gzip -d > ffmpeg-x64
          chmod +x ffmpeg-arm64 ffmpeg-x64
          lipo -create -output ffmpeg ffmpeg-arm64 ffmpeg-x64
          chmod +x ./ffmpeg
          ./ffmpeg -version

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --windowed --name "SRT4U" \
            --add-data "application:application" \
            --add-data "assets:assets" \
            --add-data "LICENSE:." \
            --add-binary "ffmpeg:." \
            --icon "assets/icon.icns" \
            main.py

      - name: Smoke-test .app executable (launch, resources, bundled FFmpeg)
        # Executes the real binary inside the .app bundle, not the Python source.
        timeout-minutes: 5
        run: |
          LOG="${TMPDIR:-/tmp}/srt4u-smoke.log"
          rm -f "$LOG"
          status=0
          dist/SRT4U.app/Contents/MacOS/SRT4U --smoke-test || status=$?
          cat "$LOG" 2>/dev/null || true
          exit $status

      - name: Package into DMG
        run: |
          hdiutil create -volname "SRT4U" -srcfolder "dist/SRT4U.app" -ov -format UDZO "dist/SRT4U-macOS.dmg"

      - name: Stamp release version (provenance marker)
        # As in the Windows step: the code is compressed and UDZO admits no
        # bytes past the koly trailer, so the stamp sits beside the binary.
        run: |
          sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml > dist/RELEASE_VERSION
          cat dist/RELEASE_VERSION

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SRT4U-macOS
          path: |
            dist/SRT4U-macOS.dmg
            dist/RELEASE_VERSION

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos, test, compat-min-pyqt6, compat-min-python]
    runs-on: ubuntu-latest
    # The only writer to the repo: every other job runs on
    # `contents: read`, so a compromised test or build cannot publish.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Validate tag and artifacts before publishing (format + version match + provenance)
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Gate before publishing: stable vMAJOR.MINOR.PATCH matching
          # pyproject.toml, the tag pointing at this commit (local git, no
          # API), and every artifact's RELEASE_VERSION stamp matching the tag.
          # The stamp sits beside the binary because PyInstaller compresses code.
          python tools/release_check.py "$TAG"

          TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "release cancelled: tag ${TAG} points at ${TAG_SHA}, not at the built commit ${EXPECTED_SHA}" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          for artifact in \
            release-artifacts/SRT4U-Windows-x64/RELEASE_VERSION \
            release-artifacts/SRT4U-Linux-x86_64/RELEASE_VERSION \
            release-artifacts/SRT4U-macOS/RELEASE_VERSION; do
            if ! grep -aqxF "$VERSION" "$artifact"; then
              echo "release cancelled: ${artifact} does not contain version ${VERSION} (artifact from another ref?)" >&2
              exit 1
            fi
          done
          echo "tag ${TAG} (commit ${EXPECTED_SHA}) verified; versioned artifacts ${VERSION}"

      - name: Prepare Assets & Generate Checksums
        run: |
          mkdir -p release-dist
          cp release-artifacts/SRT4U-Windows-x64/SRT4U-Windows-x64.exe release-dist/
          cp release-artifacts/SRT4U-Linux-x86_64/SRT4U-Linux-x86_64.AppImage release-dist/
          cp release-artifacts/SRT4U-Linux-x86_64/SRT4U-Linux-x86_64.tar.gz release-dist/
          cp release-artifacts/SRT4U-macOS/SRT4U-macOS.dmg release-dist/
          cd release-dist
          sha256sum SRT4U-* > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt

      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "SRT4U ${{ github.ref_name }} — Subtitle Processor & Translator"
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false  # only vMAJOR.MINOR.PATCH reaches here (release_check guarantees it)
          files: |
            release-dist/SRT4U-Windows-x64.exe
            release-dist/SRT4U-Linux-x86_64.AppImage
            release-dist/SRT4U-Linux-x86_64.tar.gz
            release-dist/SRT4U-macOS.dmg
            release-dist/checksums.txt

      - name: Verify Release Assets & Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying local checksums against built assets..."
          cd release-dist
          sha256sum -c checksums.txt
          echo "Verifying draft release exists on GitHub..."
          gh release view "$TAG"

      - name: Publish Stable Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Promoting draft release to public stable release..."
          gh release edit "$TAG" --draft=false
          echo "Release $TAG successfully published as stable."

