name: Build & Release Multiplatform

on:
  push:
    branches:
      - main
    # El glob es amplio a propósito: Actions no puede filtrar por formato.
    # La puerta real está en el paso "Validate tag before publishing" del job
    # release (tools/release_check.py), que exige vMAJOR.MINOR.PATCH y que el
    # tag coincida con pyproject.toml antes de publicar.
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supply chain: third-party Actions are pinned to immutable commit SHAs (with
# the human-readable tag kept as a trailing comment). Dependabot
# (.github/dependabot.yml) proposes the SHA bumps weekly;
# tests/test_hardening_portfolio.py guards the pinning so a floating tag
# cannot slip back in.

env:
  # FFmpeg estático fijado por versión: los tres builds usan el MISMO tag de
  # eugeneware/ffmpeg-static, así que los artefactos son reproducibles. No usar
  # la etiqueta móvil `latest` de yt-dlp/FFmpeg-Builds: sus autobuild se purgan
  # a los ~14 días y una URL fijada a uno de ellos acabaría en 404.
  # tests/test_coherence.py::test_ci_pins_static_ffmpeg_version lo vigila.
  # OJO: `b6.1.1` es el identificador de la release del repositorio que
  # publica el binario, no el banner semántico del propio FFmpeg; la
  # documentación lo describe como pin de descarga, nunca como versión
  # semántica de FFmpeg.
  # Al publicar: sube pyproject.toml y application/version.py a la vez (la
  # CLI, la API, los seis `about.version_pill` y este comentario se derivan
  # de ahí); el job release compara el tag con pyproject.toml y cancela si
  # hay desajuste.
  FFMPEG_VERSION: "b6.1.1"
  # appimagetool también iba por la etiqueta móvil `continuous`, lo que dejaba
  # el AppImage sin reproducir. Mismo tag estable para todos los builds.
  APPIMAGETOOL_VERSION: "1.9.1"

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # `.[api]` es obligatorio: tests/test_api.py, test_pipeline.py y
          # test_transcription.py importan fastapi.testclient a nivel de módulo,
          # así que sin el extra la colección falla y tumba todo el pipeline de
          # CI (incluidos los builds). No duplicar estas dependencias aquí:
          # pyproject.toml es la fuente y requirements.txt su espejo de base.
          pip install -r requirements.txt ".[api]"
          pip install pytest pytest-cov ruff==0.16.9

      - name: "Lint with ruff (ruff.toml: F,E7,E9,B)"
        run: ruff check application main.py conftest.py tests tools

      - name: Check formatting with ruff format
        run: ruff format --check application main.py conftest.py tests tools

      - name: Run screenshot tool smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_screenshot_tool.py -v

      - name: Run full deterministic test suite
        env:
          QT_QPA_PLATFORM: offscreen
        # `-m "not network"`: la suite primaria es determinista y no depende
        # de servicios externos de traducción; los tests `network` quedan
        # como integración opt-in (igual que la política local de README).
        # La cobertura se exige con el suelo de [tool.coverage.report]
        # (pyproject.toml); no se infla con aserciones vacías.
        run: python -m pytest tests/ -q -m "not network" --cov=application --cov-report=term-missing --cov-fail-under=62

  # Verifica que la cota mínima declarada en requirements.txt sigue funcionando.
  # La versión mínima y el runtime de Qt se resuelven desde requirements.txt,
  # así que sólo hay que actualizar ese archivo al subir la cota.
  compat-min-pyqt6:
    name: Compatibility (minimum PyQt6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg

      - name: Resolve the PyQt6 lower bound from requirements.txt
        id: min
        run: |
          MIN=$(grep -oP 'PyQt6>=\K[0-9]+\.[0-9]+\.[0-9]+' requirements.txt)
          if [ -z "$MIN" ]; then
            echo "No se encontró la cota mínima de PyQt6 en requirements.txt"
            exit 1
          fi
          MINOR="${MIN%.*}"
          MAJOR="${MINOR%%.*}"
          NEXT_MINOR="${MAJOR}.$(( ${MINOR##*.} + 1 ))"
          echo "version=$MIN" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "next_minor=$NEXT_MINOR" >> "$GITHUB_OUTPUT"
          echo "Mínimo declarado PyQt6 $MIN (runtime Qt $MINOR.x)"
          sed "s/^PyQt6.*/PyQt6==${MIN}/" requirements.txt > /tmp/requirements-min.txt
          cat /tmp/requirements-min.txt

      - name: Install the declared minimum stack
        run: |
          python -m pip install --upgrade pip
          # `.[api]` por la misma razón que en el job de test: la suite importa
          # fastapi a nivel de módulo. PyQt6 queda fijado a ==MIN por
          # requirements-min.txt, que el paso siguiente verifica.
          pip install -r /tmp/requirements-min.txt "PyQt6-Qt6>=${{ steps.min.outputs.minor }},<${{ steps.min.outputs.next_minor }}" pytest ".[api]"

      - name: Verify that the pinned minimum is really installed
        env:
          MIN_PYQT6: ${{ steps.min.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import sys

          from PyQt6.QtCore import PYQT_VERSION_STR, QT_VERSION_STR

          expected = os.environ["MIN_PYQT6"]
          print(f"PyQt6 {PYQT_VERSION_STR} / Qt {QT_VERSION_STR} (mínimo declarado {expected})")
          if PYQT_VERSION_STR != expected:
              sys.exit(f"ERROR: se esperaba PyQt6 {expected} y se instaló {PYQT_VERSION_STR}")
          PY

      - name: Run the test suite against the minimum PyQt6
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q -m "not network"

  build-windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Static FFmpeg (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/eugeneware/ffmpeg-static/releases/download/${{ env.FFMPEG_VERSION }}/ffmpeg-win32-x64" -OutFile "ffmpeg.exe"
          .\ffmpeg.exe -version

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "SRT4U" `
            --add-data "application;application" `
            --add-data "assets;assets" `
            --add-data "LICENSE;." `
            --add-binary "ffmpeg.exe;." `
            --icon "assets/icon.ico" `
            main.py

      - name: Rename binary
        run: |
          Move-Item -Path "dist/SRT4U.exe" -Destination "dist/SRT4U-Windows-x64.exe"

      - name: Stamp release version (provenance marker)
        # El sello va en un fichero de texto junto al binario: los binarios
        # PyInstaller comprimen todo el código Python (PYZ/zlib), de modo que
        # un grep del literal de versión sobre el binario nunca puede pasar.
        # El job release compara este sello con el tag; un artefacto
        # construido de otro ref no lleva el sello correcto.
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Set-Content -Path dist/RELEASE_VERSION -Value $v -NoNewline
          Write-Output "RELEASE_VERSION=$v"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SRT4U-Windows-x64
          path: |
            dist/SRT4U-Windows-x64.exe
            dist/RELEASE_VERSION

  build-linux:
    name: Build Linux (.AppImage)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xz-utils \
            file

      - name: Download Static FFmpeg (Linux)
        run: |
          curl -sL "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_VERSION}/ffmpeg-linux-x64" -o ffmpeg
          chmod +x ./ffmpeg
          ./ffmpeg -version

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "SRT4U" \
            --add-data "application:application" \
            --add-data "assets:assets" \
            --add-data "LICENSE:." \
            --add-binary "ffmpeg:." \
            --icon "assets/icon.ico" \
            main.py

      - name: Package AppImage
        run: |
          # 1. Preparar estructura AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/SRT4U AppDir/usr/bin/SRT4U
          cp ./ffmpeg AppDir/usr/bin/ffmpeg
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/srt4u.png
          cp assets/icon.png AppDir/srt4u.png

          # 2. Archivo desktop
          cat << 'EOF' > AppDir/srt4u.desktop
          [Desktop Entry]
          Name=SRT4U
          GenericName=Subtitle Processor
          Comment=Subtitle Processor, Translator & Formatter
          Exec=SRT4U
          Icon=srt4u
          Type=Application
          Categories=AudioVideo;AudioVideoEditing;Utility;
          Terminal=false
          StartupWMClass=SRT4U
          Keywords=subtitle;srt;translate;video;audio;
          EOF

          # 3. AppRun
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export QT_XCB_GL_INTEGRATION="${QT_XCB_GL_INTEGRATION:-none}"
          exec "${HERE}/usr/bin/SRT4U" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 4. Descargar appimagetool y empaquetar AppImage
          curl -sL "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          ./appimagetool --version
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/SRT4U-Linux-x86_64.AppImage

          # Respaldo tarball
          cd dist
          tar -czvf SRT4U-Linux-x86_64.tar.gz SRT4U
          cd ..

      - name: Stamp release version (provenance marker)
        # Ver comentario del paso equivalente en build-windows: el sello va
        # junto al binario porque el código PyInstaller va comprimido. sed
        # (no grep -P) para ser portable entre GNU y BSD grep.
        run: |
          sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml > dist/RELEASE_VERSION
          cat dist/RELEASE_VERSION

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SRT4U-Linux-x86_64
          path: |
            dist/SRT4U-Linux-x86_64.AppImage
            dist/SRT4U-Linux-x86_64.tar.gz
            dist/RELEASE_VERSION

  build-macos:
    name: Build macOS (.dmg)
    needs: test
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Download Static FFmpeg (macOS)
        run: |
          curl -sL "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_VERSION}/ffmpeg-darwin-arm64.gz" | gzip -d > ffmpeg-arm64
          curl -sL "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_VERSION}/ffmpeg-darwin-x64.gz" | gzip -d > ffmpeg-x64
          chmod +x ffmpeg-arm64 ffmpeg-x64
          lipo -create -output ffmpeg ffmpeg-arm64 ffmpeg-x64
          chmod +x ./ffmpeg
          ./ffmpeg -version

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --windowed --name "SRT4U" \
            --add-data "application:application" \
            --add-data "assets:assets" \
            --add-data "LICENSE:." \
            --add-binary "ffmpeg:." \
            --icon "assets/icon.icns" \
            main.py

      - name: Package into DMG
        run: |
          hdiutil create -volname "SRT4U" -srcfolder "dist/SRT4U.app" -ov -format UDZO "dist/SRT4U-macOS.dmg"

      - name: Stamp release version (provenance marker)
        # Ver comentario del paso equivalente en build-windows: el sello va
        # junto al binario porque el código PyInstaller va comprimido (y un
        # UDZO no admite bytes añadidos tras su trailer koly). sed (no
        # grep -P) porque BSD grep en macOS no soporta -P.
        run: |
          sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml > dist/RELEASE_VERSION
          cat dist/RELEASE_VERSION

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SRT4U-macOS
          path: |
            dist/SRT4U-macOS.dmg
            dist/RELEASE_VERSION

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos, compat-min-pyqt6]
    runs-on: ubuntu-latest
    # Única boca que escribe en el repo: el resto de jobs van con
    # `contents: read`, así que un test o un build comprometido no puede publicar.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts

      - name: Validate tag and artifacts before publishing (format + version match + provenance)
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 1. Formato estable y tag == project.version (pyproject.toml).
          #    Falla ANTES de publicar: v1.4.8/v1.5.0/v2.0.0 por no coincidir,
          #    v1.4.9-rc1 por no ser vMAJOR.MINOR.PATCH. El trigger `v*` sigue
          #    siendo amplio (los globs de Actions no filtran por formato);
          #    esta puerta es la que decide si se publica.
          python tools/release_check.py "$TAG"

          # 2. El tag apunta al commit que se está publicando (sin GitHub API:
          #    git local tras el checkout del ref del tag).
          TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "release cancelada: el tag ${TAG} apunta a ${TAG_SHA}, no al commit construido ${EXPECTED_SHA}" >&2
            exit 1
          fi

          # 3. Procedencia: cada artefacto lleva un sello de versión en
          #    texto plano (dist/RELEASE_VERSION, escrito por los builds a
          #    partir de pyproject.toml del commit construido). Los binarios
          #    PyInstaller comprimen el código Python, así que el literal no
          #    es localizable con grep dentro del ejecutable; el sello junto
          #    al binario es el marcador de procedencia verificable: un
          #    artefacto de otro ref no lleva la versión del tag.
          VERSION="${TAG#v}"
          for artifact in \
            release-artifacts/SRT4U-Windows-x64/RELEASE_VERSION \
            release-artifacts/SRT4U-Linux-x86_64/RELEASE_VERSION \
            release-artifacts/SRT4U-macOS/RELEASE_VERSION; do
            if ! grep -aqxF "$VERSION" "$artifact"; then
              echo "release cancelada: ${artifact} no contiene la versión ${VERSION} (¿artefacto de otro ref?)" >&2
              exit 1
            fi
          done
          echo "tag ${TAG} (commit ${EXPECTED_SHA}) verificado; artefactos con versión ${VERSION}"

      - name: Prepare Assets & Generate Checksums
        run: |
          mkdir -p release-dist
          cp release-artifacts/SRT4U-Windows-x64/SRT4U-Windows-x64.exe release-dist/
          cp release-artifacts/SRT4U-Linux-x86_64/SRT4U-Linux-x86_64.AppImage release-dist/
          cp release-artifacts/SRT4U-Linux-x86_64/SRT4U-Linux-x86_64.tar.gz release-dist/
          cp release-artifacts/SRT4U-macOS/SRT4U-macOS.dmg release-dist/
          cd release-dist
          sha256sum SRT4U-* > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "SRT4U ${{ github.ref_name }} — Subtitle Processor & Translator"
          body_path: RELEASE_NOTES.md
          prerelease: false  # sólo llega aquí vMAJOR.MINOR.PATCH (release_check lo garantiza)
          files: |
            release-dist/SRT4U-Windows-x64.exe
            release-dist/SRT4U-Linux-x86_64.AppImage
            release-dist/SRT4U-Linux-x86_64.tar.gz
            release-dist/SRT4U-macOS.dmg
            release-dist/checksums.txt

