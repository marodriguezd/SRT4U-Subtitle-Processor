name: Build & Release Multiplatform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.9

      - name: "Lint with ruff (ruff.toml: F,E7,E9,B)"
        run: ruff check application main.py conftest.py tests tools

      - name: Check formatting with ruff format
        run: ruff format --check application main.py conftest.py tests tools

      - name: Run screenshot tool smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_screenshot_tool.py -v

      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  # Verifica que la cota mínima declarada en requirements.txt sigue funcionando.
  # La versión mínima y el runtime de Qt se resuelven desde requirements.txt,
  # así que sólo hay que actualizar ese archivo al subir la cota.
  compat-min-pyqt6:
    name: Compatibility (minimum PyQt6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg

      - name: Resolve the PyQt6 lower bound from requirements.txt
        id: min
        run: |
          MIN=$(grep -oP 'PyQt6>=\K[0-9]+\.[0-9]+\.[0-9]+' requirements.txt)
          if [ -z "$MIN" ]; then
            echo "No se encontró la cota mínima de PyQt6 en requirements.txt"
            exit 1
          fi
          MINOR="${MIN%.*}"
          MAJOR="${MINOR%%.*}"
          NEXT_MINOR="${MAJOR}.$(( ${MINOR##*.} + 1 ))"
          echo "version=$MIN" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "next_minor=$NEXT_MINOR" >> "$GITHUB_OUTPUT"
          echo "Mínimo declarado PyQt6 $MIN (runtime Qt $MINOR.x)"
          sed "s/^PyQt6.*/PyQt6==${MIN}/" requirements.txt > /tmp/requirements-min.txt
          cat /tmp/requirements-min.txt

      - name: Install the declared minimum stack
        run: |
          python -m pip install --upgrade pip
          pip install -r /tmp/requirements-min.txt "PyQt6-Qt6>=${{ steps.min.outputs.minor }},<${{ steps.min.outputs.next_minor }}" pytest

      - name: Verify that the pinned minimum is really installed
        env:
          MIN_PYQT6: ${{ steps.min.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import sys

          from PyQt6.QtCore import PYQT_VERSION_STR, QT_VERSION_STR

          expected = os.environ["MIN_PYQT6"]
          print(f"PyQt6 {PYQT_VERSION_STR} / Qt {QT_VERSION_STR} (mínimo declarado {expected})")
          if PYQT_VERSION_STR != expected:
              sys.exit(f"ERROR: se esperaba PyQt6 {expected} y se instaló {PYQT_VERSION_STR}")
          PY

      - name: Run the test suite against the minimum PyQt6
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q -m "not network"

  build-windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Static FFmpeg (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "."
          $ffmpegDir = Get-ChildItem -Directory -Filter "ffmpeg-master*" | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" .\ffmpeg.exe
          .\ffmpeg.exe -version

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "SRT4U" `
            --add-data "application;application" `
            --add-data "assets;assets" `
            --add-data "LICENSE;." `
            --add-binary "ffmpeg.exe;." `
            --icon "assets/icon.ico" `
            main.py

      - name: Rename binary
        run: |
          Move-Item -Path "dist/SRT4U.exe" -Destination "dist/SRT4U-Windows-x64.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRT4U-Windows-x64
          path: dist/SRT4U-Windows-x64.exe

  build-linux:
    name: Build Linux (.AppImage)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xz-utils \
            file

      - name: Download Static FFmpeg (Linux)
        run: |
          curl -sL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg-static.tar.xz
          tar -xf ffmpeg-static.tar.xz
          FFMPEG_DIR=$(find . -maxdepth 1 -type d -name "ffmpeg-master*" | head -n 1)
          cp "$FFMPEG_DIR/bin/ffmpeg" ./ffmpeg
          chmod +x ./ffmpeg
          ./ffmpeg -version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "SRT4U" \
            --add-data "application:application" \
            --add-data "assets:assets" \
            --add-data "LICENSE:." \
            --add-binary "ffmpeg:." \
            --icon "assets/icon.ico" \
            main.py

      - name: Package AppImage
        run: |
          # 1. Preparar estructura AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/SRT4U AppDir/usr/bin/SRT4U
          cp ./ffmpeg AppDir/usr/bin/ffmpeg
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/srt4u.png
          cp assets/icon.png AppDir/srt4u.png

          # 2. Archivo desktop
          cat << 'EOF' > AppDir/srt4u.desktop
          [Desktop Entry]
          Name=SRT4U
          GenericName=Subtitle Processor
          Comment=Subtitle Processor, Translator & Formatter
          Exec=SRT4U
          Icon=srt4u
          Type=Application
          Categories=AudioVideo;AudioVideoEditing;Utility;
          Terminal=false
          StartupWMClass=SRT4U
          Keywords=subtitle;srt;translate;video;audio;
          EOF

          # 3. AppRun
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export QT_XCB_GL_INTEGRATION="${QT_XCB_GL_INTEGRATION:-none}"
          exec "${HERE}/usr/bin/SRT4U" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 4. Descargar appimagetool y empaquetar AppImage
          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/SRT4U-Linux-x86_64.AppImage

          # Respaldo tarball
          cd dist
          tar -czvf SRT4U-Linux-x86_64.tar.gz SRT4U
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRT4U-Linux-x86_64
          path: |
            dist/SRT4U-Linux-x86_64.AppImage
            dist/SRT4U-Linux-x86_64.tar.gz

  build-macos:
    name: Build macOS (.dmg)
    needs: test
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Download Static Universal FFmpeg (macOS)
        run: |
          curl -sL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz | gzip -d > ffmpeg-arm64
          curl -sL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz | gzip -d > ffmpeg-x64
          chmod +x ffmpeg-arm64 ffmpeg-x64
          lipo -create -output ffmpeg ffmpeg-arm64 ffmpeg-x64
          chmod +x ./ffmpeg
          ./ffmpeg -version

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --windowed --name "SRT4U" \
            --add-data "application:application" \
            --add-data "assets:assets" \
            --add-data "LICENSE:." \
            --add-binary "ffmpeg:." \
            --icon "assets/icon.icns" \
            main.py

      - name: Package into DMG
        run: |
          hdiutil create -volname "SRT4U" -srcfolder "dist/SRT4U.app" -ov -format UDZO "dist/SRT4U-macOS.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRT4U-macOS
          path: dist/SRT4U-macOS.dmg

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos, compat-min-pyqt6]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Assets & Generate Checksums
        run: |
          mkdir -p release-dist
          cp release-artifacts/SRT4U-Windows-x64/SRT4U-Windows-x64.exe release-dist/
          cp release-artifacts/SRT4U-Linux-x86_64/SRT4U-Linux-x86_64.AppImage release-dist/
          cp release-artifacts/SRT4U-Linux-x86_64/SRT4U-Linux-x86_64.tar.gz release-dist/
          cp release-artifacts/SRT4U-macOS/SRT4U-macOS.dmg release-dist/
          cd release-dist
          sha256sum SRT4U-* > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SRT4U ${{ github.ref_name }} — Subtitle Processor & Translator"
          body_path: RELEASE_NOTES.md
          prerelease: false  # releases ship as stable
          files: |
            release-dist/SRT4U-Windows-x64.exe
            release-dist/SRT4U-Linux-x86_64.AppImage
            release-dist/SRT4U-Linux-x86_64.tar.gz
            release-dist/SRT4U-macOS.dmg
            release-dist/checksums.txt

