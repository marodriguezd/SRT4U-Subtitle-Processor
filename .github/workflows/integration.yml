name: Integration Tests (manual)

# Manual-only (workflow_dispatch): never runs on push/PR/tags, so it cannot
# slow CI or releases. Runs the `network` tests with FFmpeg; see docs/testing.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    name: Network integration (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ".[api]" pytest

      - name: Run network-marked integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q -m network
