[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srt4u-subtitle-processor"
version = "1.4.10"
description = "Desktop and headless subtitle processing tool"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
# Base install is a functional desktop GUI + CLI: PyQt6 renders the interface
# and deep-translator powers the keyless Google free tier. requirements.txt is
# the documented base-stack mirror for source checkout/CI; tests compare its
# normalized requirements against this list to prevent silent drift.
dependencies = [
    "PyQt6>=6.6.1,<6.12",
    "deep-translator>=1.11.4",
]

[project.optional-dependencies]
# Alias of the base desktop stack; kept so `pip install ".[desktop]"` keeps
# working for existing scripts and docs.
desktop = ["PyQt6>=6.6.1,<6.12", "deep-translator>=1.11.4"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "httpx>=0.27"]
transcription = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "httpx>=0.27"]

[project.scripts]
srt4u = "application.cli:main"

[tool.setuptools.packages.find]
include = ["application*"]

[tool.pytest.ini_options]
markers = ["network: requires Internet access (excluded from the default suite)"]

[tool.coverage.run]
source = ["application"]
branch = true

[tool.coverage.report]
# Realistic floor for a desktop + headless codebase with offscreen GUI tests:
# the deterministic suite (``-m "not network"``) must stay above it. Raise
# only when the suite genuinely covers more, never to chase a number with
# meaningless assertions.
fail_under = 62
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "if TYPE_CHECKING:",
]
