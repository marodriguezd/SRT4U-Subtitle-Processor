[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srt4u-subtitle-processor"
version = "1.0.0"
description = "Desktop and headless subtitle processing tool"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
# Base install is a functional GUI + CLI; requirements.txt mirrors this list
# exactly and a coherence test fails when the two drift apart.
dependencies = [
    "PyQt6>=6.6.1,<6.12",
    "deep-translator>=1.11.4",
]

[project.optional-dependencies]
# Alias of the base desktop stack; kept so `pip install ".[desktop]"` keeps
# working for existing scripts and docs.
desktop = ["PyQt6>=6.6.1,<6.12", "deep-translator>=1.11.4"]
# fastapi 0.147 stopped applying Form defaults to omitted booleans, which
# silently disables pipeline transcription/cleaning/QA; stay below it.
api = ["fastapi>=0.115,<0.147", "uvicorn>=0.30", "python-multipart>=0.0.18", "httpx>=0.27"]
transcription = ["faster-whisper>=1.0"]
# ``tomli`` backports ``tomllib`` for the 3.10 floor read by the coherence and
# packaging guards (the fallback lives in tests/_toml_compat.py).
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "httpx>=0.27",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
srt4u = "application.cli:main"

[tool.setuptools.packages.find]
include = ["application*"]

[tool.pytest.ini_options]
markers = ["network: requires Internet access (excluded from the default suite)"]

[tool.coverage.run]
source = ["application"]
branch = true

[tool.coverage.report]
# Floor for the deterministic suite (``-m "not network"``): raise it only when
# coverage genuinely grows, never to chase a number with empty assertions.
fail_under = 62
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "if TYPE_CHECKING:",
]
