<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Rich Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="50%" stop-color="#181836"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>

    <!-- Outer Squircle Rim Light -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Center Soft Violet Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Frosted Glass Backplate -->
    <linearGradient id="plateFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="plateBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- SRT (Platinum to Lavender) -->
    <linearGradient id="srtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- 4U (Electric Cyan to Neon Violet) -->
    <linearGradient id="fourUGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Subtitle Bar Gradients -->
    <linearGradient id="subViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="subCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Drop Shadows & Blooms -->
    <filter id="shadowSquircle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>

    <filter id="shadowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>

    <filter id="neonGlow4U" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.9"/>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- 1. Base Squircle -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" 
        fill="url(#bgGrad)" 
        stroke="url(#squircleBorder)" 
        stroke-width="2.5" 
        filter="url(#shadowSquircle)"/>

  <!-- 2. Ambient Internal Glow -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" 
        fill="url(#centerGlow)"/>

  <!-- 3. Frosted Glass Inner Card (Subtitle Screen Slate) -->
  <rect x="72" y="116" width="368" height="280" rx="48" 
        fill="url(#plateFill)" 
        stroke="url(#plateBorder)" 
        stroke-width="1.8"/>

  <!-- 4. Subtle Top Refraction Arch -->
  <path d="M 104 140 Q 256 160 408 140" 
        stroke="#FFFFFF" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        fill="none" 
        opacity="0.35"/>

  <!-- 5. Unified Typographic Mark: SRT4U -->
  <g filter="url(#shadowLogo)">
    <text x="256" y="260" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Montserrat, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="3">
      <tspan fill="url(#srtGrad)">SRT</tspan><tspan fill="url(#fourUGrad)" filter="url(#neonGlow4U)">4U</tspan>
    </text>

    <!-- Stylized Subtitle Cue Bars Underneath the Logo -->
    <g transform="translate(0, 292)">
      <!-- Line 1: Primary Cue (Violet) -->
      <rect x="120" y="0" width="168" height="10" rx="5" 
            fill="url(#subViolet)"/>
      <rect x="296" y="0" width="40" height="10" rx="5" 
            fill="url(#subViolet)" 
            opacity="0.6"/>

      <!-- Line 2: Translated Cue (Cyan) -->
      <rect x="156" y="18" width="100" height="10" rx="5" 
            fill="url(#subCyan)"/>
      <rect x="264" y="18" width="128" height="10" rx="5" 
            fill="url(#subCyan)"/>
    </g>
  </g>

  <!-- 6. AI Translation Sparkle (Top-Right of Slate) -->
  <path d="M 396 136 C 396 145 402 150 411 150 C 402 150 396 155 396 164 C 396 155 390 150 381 150 C 390 150 396 145 396 136 Z" 
        fill="#38BDF8" 
        filter="url(#sparkleGlow)"/>
</svg>
